apiVersion: skaffold/v4beta8
kind: Config
metadata:
  name: notification-service
build:
  local:
    push: false
  tagPolicy:
    sha256: {}
  artifacts:
    - image: notification-service
      context: .
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: notification-service
        chartPath: helm
        namespace: dev
        createNamespace: true
        valuesFiles:
          - helm/values-dev.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_notification_service}}"
          image.tag: "{{.IMAGE_TAG_notification_service}}"
        wait: true
portForward:
  - resourceType: service
    resourceName: notification-service-nodeport
    namespace: dev
    port: 8088
    localPort: 8088
profiles:
  - name: minikube
    activation:
      - kubeContext: minikube